# Builds fonts either when a prerelease version tag (e.g. v1.2-foo)
# is created, or when source is changed.
#
# When a version tag is created, a pre-release is automatically created.
#
# Otherwise, when source changes without a tag being created,
# the build artifacts are uploaded to github and saved for 1 day.
# They can be found at https://github.com/rsms/inter/actions/runs/RUNID
name: Build fonts

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - Makefile
      - Pipfile
      - misc/makezip2.sh
      - "misc/tools/**"
    tags:
      - "v*-*"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - Makefile
      - Pipfile
      - misc/makezip2.sh
      - "misc/tools/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'

      - name: Install utilities
        run: sudo apt-get install -y zip

      - name: Setup python venv
        run: make venv

      - name: Define build identity
        # The font ships unversioned, so there is no version to read or
        # publish. The git hash is what identifies a build, and it goes into
        # the font's unique ID and into the local archive name.
        run: |
          echo "git_short=${GITHUB_SHA::10}" >> $GITHUB_ENV

      - name: make zip
        run: |
          # On a tag, build the archive under exactly the name the website
          # links to, so the download resolves. Off a tag it is a throwaway
          # CI artifact and any name will do.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            make -j zip_release
            echo "inter_zip=build/release/NeueComet.zip" >> $GITHUB_ENV
          else
            make -j zip
            echo "inter_zip=$(ls build/release/NeueComet-*.zip | head -1)" >> $GITHUB_ENV
          fi

      - name: Upload archive (unless tag)
        if: ${{ ! startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v3
        with:
          name: "Neue Comet"
          path: ${{ env.inter_zip }}
          retention-days: 1

      - name: Create release (if tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          prerelease: true
          name: "${GITHUB_REF_NAME}"
          body: "This release was created automatically"
          files: ${{ env.inter_zip }}
