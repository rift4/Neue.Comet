name: Deploy website on GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - "misc/site/**"
      - "misc/tools/build-site.py"
      - ".github/workflows/pages.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages:    write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Pages
        uses: actions/configure-pages@v2

      # The site is static HTML. docs/ is the site, so there is no build
      # output to upload -- the directory is the artifact. The only thing
      # worth doing is confirming the committed pages match the templates,
      # so a stale page fails the deploy instead of shipping silently.
      - name: Check the generated pages are current
        run: |
          python3 -m pip install --quiet pyyaml
          python3 misc/tools/build-site.py --check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1
